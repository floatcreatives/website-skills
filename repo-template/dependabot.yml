# Keep the toolchain current without anyone remembering to look.
# Security updates: weekly, grouped into one PR. Majors: monthly, one PR per package.
# A static site still ships its lockfile to the host, and the host scanner reads it.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      patch-and-minor:
        applies-to: version-updates
        update-types: ["patch", "minor"]
    ignore:
      # Real blocker, documented in BROCHURE-SITE-RULES.md §2.1: @astrojs/check
      # does not support TypeScript 7 yet. Remove this line when it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
